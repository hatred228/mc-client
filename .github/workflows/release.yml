name: Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'

      - run: chmod +x gradlew

      - run: ./gradlew clean build

      - name: Find jar
        id: find
        run: |
          JAR=$(find build/libs -name "lib.jar" | head -1)
          if [ -z "$JAR" ]; then
            JAR=$(find build/libs -name "*.jar" ! -name "*sources*" | head -1)
          fi
          echo "jar=$JAR" >> $GITHUB_OUTPUT

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          files: ${{ steps.find.outputs.jar }}
          name: ${{ github.ref_name }}