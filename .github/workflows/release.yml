name: Build and Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Build with Gradle (no obfuscation)
        run: ./gradlew clean build -Pank.obfuscate=false

      - name: Rename jar to lib.jar
        run: |
          mv build/libs/undetected-1.0.0.jar build/libs/lib.jar

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          files: build/libs/lib.jar
          name: Release ${{ github.ref_name }}
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}