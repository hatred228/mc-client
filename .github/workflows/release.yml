name: Release

on:
  push:
    tags: ['v*']

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'

      - run: chmod +x gradlew

      - name: Rebuild transformer with CI JDK
        run: |
          cd tools
          mkdir -p build/classes
          javac --release 21 -cp "libs/asm-9.7.jar:libs/asm-commons-9.7.jar" -d build/classes src/main/java/com/ank/StringEncryptorMain.java
          cd build/classes
          jar xf ../../libs/asm-9.7.jar
          jar xf ../../libs/asm-commons-9.7.jar
          rm -rf META-INF
          jar cfe ../../string-encryptor.jar com.ank.StringEncryptorMain .

      - run: ./gradlew clean build

      - name: Find obf jar
        id: find
        run: |
          echo "=== build/libs contents ==="
          ls -la build/libs/
          JAR=$(find build/libs -name "*-obf.jar" | head -1)
          if [ -z "$JAR" ]; then
            echo "ERROR: no *-obf.jar found"
            exit 1
          fi
          echo "found $JAR"
          ls -la "$JAR"
          mkdir -p out
          cp "$JAR" out/lib.jar
          echo "jar=out/lib.jar" >> $GITHUB_OUTPUT

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          files: ${{ steps.find.outputs.jar }}
          name: ${{ github.ref_name }}