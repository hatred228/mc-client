plugins {
    id 'net.fabricmc.fabric-loom-remap' version '1.14-SNAPSHOT'
    id 'maven-publish'
}

version = project.mod_version
group = project.maven_group

// === Генерация рандомного id при каждой сборке ===
def buildId = "lib" + Long.toHexString(System.currentTimeMillis() & 0xFFFFFF)
ext.buildId = buildId

base {
    archivesName = "lib-${buildId}"
}

repositories {
    mavenCentral()
}

dependencies {
    minecraft "com.mojang:minecraft:${project.minecraft_version}"
    mappings "net.fabricmc:yarn:${project.yarn_mappings}:v2"
    modImplementation "net.fabricmc:fabric-loader:${project.loader_version}"
    modImplementation "net.fabricmc.fabric-api:fabric-api:${project.fabric_version}"
    include(implementation("org.luaj:luaj-jse:3.0.1"))
}

// ============================================================
// Замена mod_id, name, авторов и переименование mixins.json
// ============================================================
processResources {
    inputs.property "version", project.version
    inputs.property "id", buildId
    inputs.property "name", "Library Utils"

    filesMatching("fabric.mod.json") {
        expand(
            "version": project.version,
            "id": buildId,
            "name": "Library Utils",
            "description": "Utility library",
            "authors": "anon"
        )
    }

    // переименовываем undetected.mixins.json → <buildId>.mixins.json
    rename 'undetected\\.mixins\\.json', "${buildId}.mixins.json"
}

// после processResources — обновляем ссылку на mixins файл в fabric.mod.json
tasks.named('processResources') {
    doLast {
        def f = file("$buildDir/resources/main/fabric.mod.json")
        if (f.exists()) {
            def text = f.text
            text = text.replace('${id}.mixins.json', "${buildId}.mixins.json")
            f.text = text
        }
    }
}

tasks.withType(JavaCompile).configureEach {
    it.options.release = 21
}

java {
    withSourcesJar()
    sourceCompatibility = JavaVersion.VERSION_21
    targetCompatibility = JavaVersion.VERSION_21
}

remapJar {
    archiveFileName = "lib.jar"
}